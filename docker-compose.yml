services:
  # ===========================================
  # DATABASES
  # ===========================================

  # PostgreSQL cho tool truy vấn điểm sinh viên
  postgres:
    image: postgres:14
    container_name: chatbot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - chatbot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB cho chat/user data
  mongodb:
    image: mongo:7.0
    container_name: chatbot_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - chatbot_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # AI SERVICES (Optional - uncomment if not running Ollama locally)
  # ===========================================

  # ollama:
  #   image: ollama/ollama
  #   container_name: chatbot_ollama
  #   restart: always
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - chatbot_network

  # ===========================================
  # BACKEND
  # ===========================================

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot_backend
    image: chatbot_agent:latest
    command: python -m uvicorn src.backend.main:app --host 0.0.0.0 --port 3434
    ports:
      - "3434:3434"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - POSTGRES_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Use host.docker.internal to connect to Ollama running on host machine
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./document_graph:/app/document_graph
      - ./department_graphs:/app/department_graphs
      - ./vector_db:/app/vector_db
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatbot_network
    restart: always

  # ===========================================
  # FRONTEND
  # ===========================================

  frontend:
    build:
      context: ../chatbot_FE
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:3434}
        REACT_APP_WS_URL: ${REACT_APP_WS_URL:-ws://localhost:3434}
    container_name: chatbot_frontend
    image: chatbot_frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - chatbot_network
    restart: always

  # ===========================================
  # REVERSE PROXY (Optional - for production)
  # ===========================================

  nginx:
    image: nginx:latest
    container_name: chatbot_nginx
    restart: always
    ports:
      - "8086:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - chatbot_network

# ===========================================
# NETWORKS
# ===========================================

networks:
  chatbot_network:
    driver: bridge

# ===========================================
# VOLUMES
# ===========================================

volumes:
  postgres_data:
  mongodb_data:
  ollama_data:
